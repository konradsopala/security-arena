name: CI

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
  issue_comment:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Check out the PR's head so we build exactly what the contributor pushed.
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: npm install
      - run: npm run build

      # Greet the contributor by echoing their PR title.
      - name: Welcome
        run: echo "Thanks for the PR titled ${{ github.event.pull_request.title }}"

      - name: Deploy preview
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          echo "deploying preview for ${{ github.event.comment.body }}"
